<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Plan Wallpaper</title>
<style>
:root{--brand:#39ff88;--brand2:#b36bff;--bg:#0b0d12;--card:#141821;--line:#232a38;--txt:#e8ecf4;--mute:#8791a5;
--c0:#ff5fa2;--c1:#ffb347;--c2:#e6ff4d;--c3:#4dffd2;--c4:#5fb8ff;--c5:#b36bff;--c6:#ff7a59}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
/* ---------- wallpaper ---------- */
#wall{display:none;height:100%;padding:3vh 3vw;flex-direction:column;gap:2.2vh;
background:radial-gradient(1200px 600px at 80% -10%,#171c2b 0%,transparent 60%),var(--bg)}
.warn{font-size:clamp(26px,4.6vw,76px);font-weight:900;letter-spacing:-.02em;line-height:1.05;color:var(--brand);text-shadow:0 0 28px color-mix(in srgb,var(--brand) 35%,transparent)}
.sub{display:flex;align-items:center;gap:16px;color:var(--mute);font-size:clamp(12px,1.1vw,18px)}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .6s}
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:1vw;min-height:0}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:1vh;overflow:hidden}
.col.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.col h3{font-size:clamp(12px,1.2vw,20px);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.col.today h3{color:var(--brand)}
.t{border-left:4px solid var(--c);padding:.7vh .7vw;border-radius:8px;background:color-mix(in srgb,var(--c) 9%,transparent);font-size:clamp(11px,1.05vw,17px);line-height:1.25}
.t small{display:block;color:var(--c);opacity:.9;font-size:.85em;margin-bottom:2px}
.t.main{background:color-mix(in srgb,var(--brand) 18%,transparent);border-left-color:var(--brand);font-weight:700;box-shadow:0 0 18px color-mix(in srgb,var(--brand) 22%,transparent)}
.t.main small{color:var(--brand)}
.t.done{opacity:.38;text-decoration:line-through}
.t.done::after{content:" ✓"}
.empty{color:#3a4254;font-size:.9em}
.dayhead{display:flex;align-items:baseline;gap:2vw;color:var(--c)}
.dn{font-size:clamp(34px,5vw,84px);font-weight:800;letter-spacing:-.02em}
.dd{font-size:clamp(16px,1.8vw,30px);color:var(--mute)}
.tl{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh;max-width:62vw;overflow:hidden}
#wall .tl .t{font-size:clamp(16px,2vw,32px);padding:1.3vh 1.4vw;border-radius:10px}
#wall .tl .t small{font-size:.7em}
#wall .empty{font-size:clamp(16px,1.8vw,28px);color:#4a5368}
#wall,#wall *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none;cursor:default;-webkit-tap-highlight-color:transparent}
#wall ::selection{background:transparent}
#wall{background:#000!important;color:#fff}
#wall .warn{color:#fff;font-size:clamp(34px,6.6vw,112px);text-shadow:none;line-height:1.02}
#wall .dayhead .dd{color:#bfc4cf}
#wall .t{color:#fff;background:color-mix(in srgb,var(--c) 14%,#000)}
#wall .t.main{background:color-mix(in srgb,var(--brand) 22%,#000)}
.body{flex:1;min-height:0;display:flex;align-items:center;gap:3vw}
.body .tl{flex:1;align-self:stretch;max-width:56vw}
.ringbox{margin-left:auto;margin-right:2vw;display:flex;flex-direction:column;align-items:center;gap:2vh}
.ring{position:relative;width:clamp(170px,23vw,400px);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.pc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,5vw,86px);font-weight:800;color:#fff}
.rl{color:#d5d9e2;font-size:clamp(14px,1.5vw,26px);text-align:center}
.rl b{color:var(--brand)}
#wall .tl{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,min-content);grid-auto-columns:minmax(0,1fr);gap:1.1vh 1.1vw;align-content:start;max-width:60vw}
#wall .tl .t{font-size:clamp(15px,1.8vw,29px);padding:1vh 1.1vw}
#wall .tl.compact .t{font-size:clamp(12px,1.4vw,22px);padding:.7vh .8vw}
#wall .tl.compact .t small{font-size:.75em;margin-bottom:1px}
#wall .tl .empty{grid-row:1}
#wall{position:relative;overflow:hidden}
#wall>*:not(.wm){position:relative;z-index:1}
#wall .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;font-size:clamp(90px,17vw,340px);font-weight:900;line-height:1;white-space:nowrap;color:#151515;letter-spacing:.02em}

#admin{--bg:#080808;--panel:#111;--panel2:#151515;--tx:#f5f5f5;--mu:#8d8d8d;--ln:#242424;--ln2:#343434;--ac:#39ff88;--good:#54c98a;min-height:100vh;display:flex;background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--ac) 8%,transparent),transparent 65%),var(--bg);color:var(--tx);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#admin[data-theme=light]{--bg:#f6f6f2;--panel:#fff;--panel2:#f0f0ea;--tx:#141414;--mu:#6b6b6b;--ln:#e3e3dc;--ln2:#cfcfc5}
#admin button,#admin input,#admin select{font:inherit;color:inherit}
#admin button{cursor:pointer}
#admin input:focus,#admin select:focus,#admin button:focus{outline:none}
.xside{width:245px;border-right:1px solid var(--ln);padding:24px 16px;position:fixed;inset:0 auto 0 0;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:5}
.xbrand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.xmark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ac);color:#080808;font-weight:900}
.xbt{font-weight:800;letter-spacing:-.4px}.xbt span{display:block;color:var(--mu);font-size:10px;font-weight:500;margin-top:2px}
.xlab{color:#666;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:0 10px;margin:16px 0 7px}
.xnav{width:100%;border:1px solid transparent;background:transparent;color:var(--mu);padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:4px;transition:.18s}
.xnav:hover{color:var(--tx);background:var(--panel)}.xnav.on{color:var(--tx);background:var(--panel2);border-color:var(--ln)}
.xnav i{width:18px;text-align:center;font-style:normal}
.xbot{position:absolute;left:16px;right:16px;bottom:20px}
.xmain{margin-left:245px;width:calc(100% - 245px);min-height:100vh;padding:30px 38px 60px}
.xtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.xeye{color:var(--mu);font-size:10px;letter-spacing:1.7px;text-transform:uppercase}
.xtop h1{font-size:32px;letter-spacing:-1.3px;margin-top:5px}
.xbtn,.xic{border:1px solid var(--ln);background:var(--panel);border-radius:10px;transition:.18s}
.xbtn{padding:10px 15px;color:var(--mu)}.xbtn:hover,.xic:hover{border-color:var(--ln2);background:var(--panel2)}
.xbtn.pri{background:var(--ac);color:#080808;border-color:var(--ac);font-weight:750}.xbtn.pri:hover{filter:brightness(1.08)}
.xic{width:31px;height:31px;color:var(--mu);border-radius:9px}
.xview{display:none}.xview.on{display:block}
.xstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.xstat{background:var(--panel);border:1px solid var(--ln);border-radius:15px;padding:17px}
.xstat small{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.xstat b{display:block;font-size:29px;margin-top:8px;letter-spacing:-1px}.xstat em{font-style:normal;color:var(--mu);font-size:11px}
.xhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.xhead h2{font-size:17px}.xwc{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px}
.xdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
.xday{border:1px solid var(--ln);background:var(--panel);color:var(--mu);border-radius:14px;padding:12px 5px;transition:.2s}
.xday:hover{border-color:var(--ln2);color:var(--tx);transform:translateY(-1px)}
.xday.tod:not(.on){border-color:var(--ac)}
.xday.on{background:var(--ac);border-color:var(--ac);color:#080808}
.xday small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.xday b{display:block;margin-top:3px;font-size:16px}.xday span{display:block;font-size:9px;margin-top:4px;opacity:.65}
.xbar{display:flex;justify-content:space-between;align-items:end;margin:8px 0 12px}
.xbar h2{font-size:22px;letter-spacing:-.6px}.xbar div{color:var(--mu);font-size:12px}
.xtasks{display:flex;flex-direction:column;gap:8px;max-width:900px}
.xtask{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;border:1px solid var(--ln);background:var(--panel);border-radius:15px;padding:14px 15px;transition:.2s}
.xtask:hover{border-color:var(--ln2);transform:translateY(-1px)}
.xchk{width:20px;height:20px;border:1px solid var(--ln2);border-radius:6px;background:transparent;color:transparent;font-size:12px;line-height:1;padding:0}
.xtask.done{opacity:.5}.xtask.done .xchk{background:var(--good);border-color:var(--good);color:#07120d}.xtask.done .xname{text-decoration:line-through}
.xname{font-weight:650;font-size:14px}
.xmeta{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:11px;margin-top:4px}
.xtag{font-size:9px;text-transform:uppercase;border-radius:99px;padding:3px 7px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.xacts{display:flex;gap:5px}
.xempty{border:1px dashed var(--ln2);border-radius:16px;padding:48px 20px;text-align:center;color:var(--mu)}
.xempty strong{display:block;color:var(--tx);font-size:15px;margin-bottom:5px}
.xmonth{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.xmh{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px;text-align:center;padding:4px}
.xcell{min-height:74px;border:1px solid var(--ln);background:var(--panel);border-radius:12px;padding:9px;text-align:left;transition:.2s}
.xcell:hover{border-color:var(--ln2)}.xcell.tod{border-color:var(--ac)}.xcell b{font-size:14px}
.xcell span{display:block;margin-top:8px;font-size:11px;color:var(--ac)}
.xbr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:12px;margin-bottom:12px;font-size:12px;color:var(--mu)}
.xbr em{font-style:normal;text-align:right}
.xtrk{height:9px;background:var(--panel2);border-radius:9px;overflow:hidden}.xtrk i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.xcard{background:var(--panel);border:1px solid var(--ln);border-radius:15px;padding:20px;margin-top:14px;max-width:700px}
.xcard h3{font-size:14px;margin-bottom:16px}
.xovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;align-items:center;justify-content:center;padding:16px}
.xovl.on{display:flex}
.xmodal{background:var(--panel);border:1px solid var(--ln);border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.xmhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.xmhd h2{font-size:18px}
.xf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.xfld{display:flex;flex-direction:column;gap:6px}.xfld.full{grid-column:1/-1}
.xfld label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.xfld input,.xfld select{background:var(--panel2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.xfld input:focus,.xfld select:focus{border-color:var(--ac)}
.xck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin-bottom:8px}
.xmact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.xopt{display:flex;gap:8px;margin:8px 0 18px}.xopt .xbtn.on{border-color:var(--ac);color:var(--tx)}
#admin input[type=color]{width:46px;height:36px;padding:0;border:1px solid var(--ln);border-radius:8px;background:none}
@media(max-width:820px){#admin{flex-direction:column}.xside{position:static;width:100%;border:0;border-bottom:1px solid var(--ln);padding:14px}.xbot{position:static;margin-top:8px}.xmain{margin-left:0;width:100%;padding:20px 14px 50px}.xstats{grid-template-columns:repeat(2,1fr)}.xcell{min-height:56px;padding:6px}}
#mascot{display:none;position:fixed;right:5vw;bottom:2vh;z-index:2;flex-direction:column;align-items:center;pointer-events:none;-webkit-user-select:none;user-select:none}
#mascot .mw{position:relative;height:56vh;aspect-ratio:344/760;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite;transition:filter .8s}
#mascot img{height:100%;width:100%;display:block}
#mascot .fr{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
#mascot.sad .fr{opacity:1}
#mascot.sad .mw{filter:saturate(.55) brightness(.82);animation:sulk 4.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-1.4vh) rotate(.8deg)}}
@keyframes sulk{0%,100%{transform:translateY(0) rotate(-2.2deg)}50%{transform:translateY(.6vh) rotate(-3.4deg)}}
#mascot .mb{max-width:19vw;min-width:9vw;margin-bottom:1.6vh;padding:1.1vh 1.2vw;border-radius:16px;background:#fff;color:#000;font-weight:800;font-size:clamp(12px,1.3vw,23px);line-height:1.25;text-align:center;position:relative;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#mascot .mb.on{opacity:1;transform:none}
#mascot .mb.q{background:var(--brand);font-style:italic}
#mascot .mb::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#mascot .mb.q::after{border-top-color:var(--brand)}
</style>
</head>

<div id="admin" style="display:none"></div>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const API='/api/tasks',$=id=>document.getElementById(id);
let S={brand:'#39ff88',tasks:[]},PW=localStorage.getItem('studyplan.pw')||'';
async function load(){
  try{const r=await fetch(API,{cache:'no-store'});if(r.ok){S=await r.json();localStorage.setItem('studyplan.cache',JSON.stringify(S));return}}catch(e){}
  try{const c=localStorage.getItem('studyplan.cache');if(c)S=JSON.parse(c)}catch(e){}
}
async function save(){
  if(!PW){PW=prompt('Admin password')||'';localStorage.setItem('studyplan.pw',PW)}
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-key':PW},body:JSON.stringify(S)});
    if(r.status===401){localStorage.removeItem('studyplan.pw');PW='';alert('Wrong password - change not saved');await load();renderAdmin()}
  }catch(e){alert('Could not save - check internet')}
}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
function addD(s,n){const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d}
function fmtDate(s,i){return addD(s,i).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wk=w=>S.tasks.filter(t=>t.week===w).sort((a,b)=>(a.t1||'').localeCompare(b.t1||''));
const thisWeek=()=>wk(weekStart());
const when=t=>t.t1?(t.t2?t.t1+' – '+t.t2:t.t1):'Anytime';
const pc=(a,b)=>b?Math.round(a/b*100):0;
function renderWall(){
  document.documentElement.style.setProperty('--brand',S.brand);
  document.body.style.background='#000';
  const i=(new Date().getDay()+6)%7,ts=thisWeek().filter(t=>t.day===i),tot=ts.length;
  $('wall').innerHTML=`<div class="wm">IMPACT</div><div class="warn">Stick to the plan and not to the mood.</div>
  <div class="dayhead" style="--c:var(--c${i})"><span class="dn">${DAYS[i]}</span><span class="dd">${fmtDate(weekStart(),i)}</span></div>
  <div class="body"><div class="tl${tot>5?' compact':''}">`+(tot?ts.map(t=>`<div class="t${t.main?' main':''}${t.done?' done':''}" style="--c:var(--c${i})"><small>${when(t)}</small>${esc(t.title)}</div>`).join(''):'<div class="empty">No tasks planned today</div>')+'</div></div>';
}
let VW=weekStart(),SD=(new Date().getDay()+6)%7,MONTH=new Date(),EDIT=null;
function renderAdmin(){
  const A=$('admin');A.style.setProperty('--ac',S.brand);$('b1').value=S.brand;
  const rw=weekStart(),ti=(new Date().getDay()+6)%7,tt=wk(rw).filter(t=>t.day===ti),td=tt.filter(t=>t.done).length,ts=wk(VW);
  $('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('sTod').textContent=tt.length;$('sDone').textContent=td;$('sPct').textContent=pc(td,tt.length)+'%';$('sAll').textContent=ts.length;
  $('wr').textContent=fmtDate(VW,0)+' – '+fmtDate(VW,6)+(VW===rw?' · This week':'');
  $('days').innerHTML=DAYS.map((d,i)=>{const n=ts.filter(t=>t.day===i);return `<button class="xday${i===SD?' on':''}${VW===rw&&i===ti?' tod':''}" data-d="${i}"><small>${d.slice(0,3)}</small><b>${addD(VW,i).getDate()}</b><span>${n.filter(t=>t.done).length}/${n.length}</span></button>`}).join('');
  const dt=ts.filter(t=>t.day===SD),dd=dt.filter(t=>t.done).length;
  $('dtitle').textContent=DAYS[SD]+' · '+fmtDate(VW,SD);$('dprog').textContent=pc(dd,dt.length)+'% complete';
  $('tasks').innerHTML=dt.length?dt.map(t=>`<div class="xtask${t.done?' done':''}"><button class="xchk" data-done="${t.id}">✓</button><div><div class="xname">${esc(t.title)}</div><div class="xmeta"><span>${when(t)}</span>${t.priority?`<span>${t.priority}</span>`:''}${t.main?'<span class="xtag">Main</span>':''}</div></div><div class="xacts"><button class="xic" data-edit="${t.id}">✎</button><button class="xic" data-del="${t.id}">✕</button></div></div>`).join(''):'<div class="xempty"><strong>No tasks for this day</strong>Click + Add Task to plan something.</div>';
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  $('mtt').textContent=MONTH.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let h=DAYS.map(d=>`<div class="xmh">${d.slice(0,3)}</div>`).join('')+'<div></div>'.repeat(off);
  for(let d=1;d<=dim;d++){const x=new Date(y,m,d),n=S.tasks.filter(t=>t.week===weekStart(x)&&t.day===(x.getDay()+6)%7);
    h+=`<button class="xcell${ymd(x)===ymd(new Date())?' tod':''}" data-date="${ymd(x)}"><b>${d}</b>${n.length?`<span>${n.filter(t=>t.done).length}/${n.length}</span>`:''}</button>`}
  $('mg').innerHTML=h;
  const all=S.tasks,ad=all.filter(t=>t.done).length;
  $('pT').textContent=all.length;$('pD').textContent=ad;$('pP').textContent=pc(ad,all.length)+'%';$('ppd').textContent=fmtDate(VW,0)+' – '+fmtDate(VW,6);
  $('pb').innerHTML=DAYS.map((d,i)=>{const n=ts.filter(t=>t.day===i),k=n.filter(t=>t.done).length;return `<div class="xbr"><span>${d.slice(0,3)}</span><div class="xtrk"><i style="width:${pc(k,n.length)}%"></i></div><em>${k}/${n.length}</em></div>`}).join('');
}
function openModal(id){
  EDIT=id||null;const t=id?S.tasks.find(x=>x.id==id):null;
  $('mttl').textContent=t?'Edit Task':'Add Task';$('msub').textContent=t?'Save Task':'Add Task';
  $('title').value=t?t.title:'';$('day').value=t?t.day:SD;$('pri').value=t&&t.priority||'Medium';
  $('t1').value=t?t.t1||'':'';$('t2').value=t?t.t2||'':'';$('main').checked=!!(t&&t.main);$('rep').checked=false;
  $('replab').style.display=t?'none':'flex';$('movl').classList.add('on');$('title').focus();
}
const closeModal=()=>$('movl').classList.remove('on');
function setView(v){document.querySelectorAll('.xview').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.xnav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function setTheme(t){$('admin').dataset.theme=t;$('ti').textContent=t==='light'?'☀':'☾';localStorage.setItem('studyplan.theme',t)}
async function init(){
  await load();
  const wall=true;
  if(wall){['selectstart','dragstart','contextmenu','mousedown'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));$('admin').style.display='none';$('wall').style.display='flex';$('mascot').style.display='flex';renderWall();mascotInit();
    setInterval(async()=>{await load();renderWall()},5000);
  }else{
    setTheme(localStorage.getItem('studyplan.theme')||'dark');
    DAYS.forEach((d,i)=>$('day').add(new Option(d,i)));
    renderAdmin();
    document.querySelectorAll('.xnav[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
    $('days').onclick=e=>{const b=e.target.closest('[data-d]');if(b){SD=+b.dataset.d;renderAdmin()}};
    $('pw').onclick=()=>{VW=ymd(addD(VW,-7));renderAdmin()};
    $('nw').onclick=()=>{VW=ymd(addD(VW,7));renderAdmin()};
    $('pm').onclick=()=>{MONTH=new Date(MONTH.getFullYear(),MONTH.getMonth()-1,1);renderAdmin()};
    $('nm').onclick=()=>{MONTH=new Date(MONTH.getFullYear(),MONTH.getMonth()+1,1);renderAdmin()};
    $('mg').onclick=e=>{const b=e.target.closest('[data-date]');if(!b)return;const d=new Date(b.dataset.date+'T00:00');VW=weekStart(d);SD=(d.getDay()+6)%7;setView('week');renderAdmin()};
    $('tasks').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.done){const t=S.tasks.find(x=>x.id==b.dataset.done);t.done=!t.done;renderAdmin();await save()}
      else if(b.dataset.edit)openModal(b.dataset.edit);
      else if(b.dataset.del){S.tasks=S.tasks.filter(x=>x.id!=b.dataset.del);renderAdmin();await save()}};
    $('addbtn').onclick=()=>openModal();$('mx').onclick=closeModal;$('mc').onclick=closeModal;
    $('f').onsubmit=async e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;
      const v={title,t1:$('t1').value,t2:$('t2').value,priority:$('pri').value,main:$('main').checked};
      if(EDIT){Object.assign(S.tasks.find(x=>x.id==EDIT),v,{day:+$('day').value})}
      else{(($('rep').checked)?[0,1,2,3,4,5,6]:[+$('day').value]).forEach((d,k)=>S.tasks.push({id:Date.now()+k,week:VW,day:d,done:false,...v}))}
      closeModal();renderAdmin();await save()};
    $('cust').onclick=()=>$('covl').classList.add('on');$('cx').onclick=()=>$('covl').classList.remove('on');
    $('b1').oninput=e=>{S.brand=e.target.value;renderAdmin()};$('b1').onchange=()=>save();
    document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
    $('theme').onclick=()=>setTheme($('admin').dataset.theme==='light'?'dark':'light');
    $('clr').onclick=async()=>{if(confirm('Remove all tasks in the week shown?')){S.tasks=S.tasks.filter(t=>t.week!==VW);$('covl').classList.remove('on');renderAdmin();await save()}};
    $('openw').onclick=()=>window.open(location.origin+'/#wallpaper','_blank');
  }
}
const QUOTE='Life comes from you and not at you.';
let quoteUntil=0;
function mascotTick(){
  const b=$('mb'),ti=(new Date().getDay()+6)%7,ts=thisWeek().filter(t=>t.day===ti),pend=ts.filter(t=>!t.done),mp=pend.filter(t=>t.main),sad=ts.length>0&&pend.length>0;
  $('mascot').classList.toggle('sad',sad);
  let msg='',q=false;
  if(Date.now()<quoteUntil){msg=QUOTE;q=true}
  else if(sad){const L=[];if(mp.length)L.push('Complete your main task: '+mp[0].title+(mp.length>1?' (+'+(mp.length-1)+' more)':'')+'!');L.push('Forget about the dream.');msg=L[Math.floor(Date.now()/7000)%L.length]}
  if(msg)b.textContent=msg;
  b.classList.toggle('q',q);b.classList.toggle('on',!!msg);
}
function mascotInit(){
  const showQuote=()=>{quoteUntil=Date.now()+30000;mascotTick()};
  showQuote();setInterval(showQuote,600000);setInterval(mascotTick,1000);
}
init();
</script>
</body>
